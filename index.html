
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <!-- Cabeçalho Limpo -->
        <header class="app-header">
            <h1>Pokedex</h1>
            <p>Explore o mundo Pokémon</p>
        </header>

        <!-- Área de Exibição do Pokémon -->
        <div class="display-area">
            <div id="resultado">
                <!-- O JavaScript injetará a imagem e os textos aqui -->
            </div>
        </div>

        <!-- Campo de Busca Moderno -->
        <div class="search-group">
            <input type="text" id="campoBusca" placeholder="Nome ou ID do Pokémon...">
            <button id="btnBuscar">Buscar</button>
        </div>

        <!-- Navegação Fluida -->
        <div class="navigation-group">
            <button id="btnAnterior" class="btn-secondary">Anterior</button>
            <button id="btnAleatorio" class="btn-primary">Aleatório</button>
            <button id="btnProximo" class="btn-secondary">Próximo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
